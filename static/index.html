<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI C++ Compiler IDE</title>
    <!-- Monaco Editor Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        header { background: #090d16; border-bottom: 1px solid #1e293b; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; height: 56px; }
        .logo-group { display: flex; align-items: center; gap: 12px; }
        .logo-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }
        .pill-badge { background: #1e293b; color: #38bdf8; font-size: 0.72rem; padding: 3px 10px; border-radius: 9999px; border: 1px solid #334155; font-family: monospace; }
        .run-btn { background: #06b6d4; color: #020617; font-weight: 700; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 0.875rem; transition: background 0.15s ease; }
        .run-btn:hover { background: #22d3ee; }

        /* Workspace Main Grid */
        main { flex: 1; display: flex; overflow: hidden; }
        .editor-pane { width: 50%; border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        .pane-header { background: #090d16; padding: 8px 16px; border-bottom: 1px solid #1e293b; font-size: 0.75rem; color: #94a3b8; font-family: monospace; display: flex; justify-content: space-between; }
        #editor { flex: 1; width: 100%; height: 100%; }

        /* Right Panel Output */
        .output-pane { width: 50%; background: #020617; display: flex; flex-direction: column; padding: 20px; gap: 16px; overflow-y: auto; }
        .status-ready { color: #34d399; font-family: monospace; font-size: 0.75rem; }
        .status-busy { color: #fbbf24; font-family: monospace; font-size: 0.75rem; }
        .status-error { color: #f87171; font-family: monospace; font-size: 0.75rem; }

        .console-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 14px; font-family: monospace; font-size: 0.8rem; color: #cbd5e1; white-space: pre-wrap; line-height: 1.5; }

        /* AI Diagnostics Card */
        .ai-card { background: #0f172a; border: 1px solid rgba(6, 182, 212, 0.35); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
        .ai-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .ai-title { color: #38bdf8; font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .ai-title svg { width: 18px !important; height: 18px !important; max-width: 18px !important; max-height: 18px !important; stroke: #38bdf8; flex-shrink: 0; }
        .model-badge { background: #083344; color: #67e8f9; border: 1px solid #155e75; font-size: 0.72rem; padding: 2px 10px; border-radius: 9999px; font-family: monospace; }

        /* Formatted Content inside AI Card */
        .ai-content { font-size: 0.85rem; line-height: 1.6; color: #cbd5e1; }
        .ai-content h3 { font-size: 0.9rem; font-weight: 700; color: #38bdf8; margin-top: 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .ai-content h3::before { content: ""; width: 6px; height: 6px; background: #38bdf8; border-radius: 50%; display: inline-block; }
        .ai-content p { margin-bottom: 8px; }
        .ai-content strong { color: #f8fafc; font-weight: 600; }
        .ai-content code { background: #020617; color: #67e8f9; padding: 2px 6px; border-radius: 4px; border: 1px solid #1e293b; font-family: monospace; font-size: 0.78rem; }
        .ai-content .code-block { background: #020617; border: 1px solid #1e293b; border-radius: 6px; margin: 10px 0; overflow: hidden; font-family: monospace; font-size: 0.78rem; }
        .ai-content .code-header { background: #0f172a; padding: 4px 12px; border-bottom: 1px solid #1e293b; color: #64748b; font-size: 0.7rem; }
        .ai-content pre { padding: 12px; color: #67e8f9; overflow-x: auto; margin: 0; }
        .ai-content li { margin-left: 18px; list-style-type: disc; margin-bottom: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header>
        <div class="logo-group">
            <span class="logo-title">⚡ AI C++ Compiler IDE</span>
            <span class="pill-badge">C++17 Pipeline</span>
        </div>
        <button id="run-btn" onclick="runCompiler()" class="run-btn">Run Pipeline</button>
    </header>

    <main>
        <!-- Editor Pane -->
        <div class="editor-pane">
            <div class="pane-header">
                <span>source.cpp</span>
                <span>Monaco Editor</span>
            </div>
            <div id="editor"></div>
        </div>

        <!-- Telemetry & Diagnostic Pane -->
        <div class="output-pane">
            <div class="pane-header" style="background:transparent; padding:0 0 8px 0; border:none;">
                <span style="font-family:monospace; text-transform:uppercase; font-size:0.7rem;">Compiler Telemetry & Diagnostics</span>
                <span id="status-indicator" class="status-ready">Ready</span>
            </div>

            <div id="console-box" class="console-box">Click "Run Pipeline" to execute compiler...</div>

            <!-- AI Diagnostic Advice Card -->
            <div id="ai-advice-card" class="ai-card hidden">
                <div class="ai-card-header">
                    <div class="ai-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        <span>Gemini AI Diagnostic Advice</span>
                    </div>
                    <span id="ai-model-badge" class="model-badge">AI Model</span>
                </div>
                <div id="ai-content" class="ai-content"></div>
            </div>
        </div>
    </main>

    <script>
        let editor;
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: `int score = 100;\nscore = "invalid_string_assignment";`,
                language: 'cpp',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false }
            });
        });

        function formatMarkdownToHTML(text) {
            if (!text) return '';

            let modelName = "Gemini AI";
            const bannerMatch = text.match(/^\[(.*?) Advice\]/i);
            if (bannerMatch) {
                modelName = bannerMatch[1];
                text = text.replace(/^\[.*?Advice\]\s*/i, '');
            }

            const badgeElem = document.getElementById('ai-model-badge');
            if (badgeElem) badgeElem.innerText = modelName;

            text = text.replace(/===================================/g, '').trim();

            // Code blocks
            text = text.replace(/```[a-zA-Z]*\n([\s\S]*?)```/g, function(match, code) {
                const escaped = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').trim();
                return `<div class="code-block"><div class="code-header">Suggested Code Fix</div><pre><code>${escaped}</code></pre></div>`;
            });

            // Headings
            text = text.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            text = text.replace(/^## (.*$)/gim, '<h2 style="font-size:0.95rem; font-weight:700; color:#f8fafc; margin-top:14px; margin-bottom:6px;">$1</h2>');

            // Bold & Inline Code
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Bullet points
            text = text.replace(/^\s*[\*\-]\s+(.*$)/gim, '<li>$1</li>');

            const blocks = text.split('\n\n');
            const htmlBlocks = blocks.map(block => {
                block = block.trim();
                if (!block) return '';
                if (block.startsWith('<h') || block.startsWith('<div') || block.startsWith('<li')) {
                    return block;
                }
                return `<p>${block.replace(/\n/g, '<br>')}</p>`;
            });

            return htmlBlocks.join('');
        }

        async function runCompiler() {
            const code = editor.getValue();
            const consoleBox = document.getElementById('console-box');
            const statusElem = document.getElementById('status-indicator');
            const aiCard = document.getElementById('ai-advice-card');
            const aiContent = document.getElementById('ai-content');

            statusElem.innerText = "Compiling...";
            statusElem.className = "status-busy";
            consoleBox.innerText = "Executing compiler pipeline...\n";
            aiCard.classList.add('hidden');

            try {
                const response = await fetch('/api/compile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });

                const data = await response.json();
                const rawOutput = data.output;

                const aiMarker = "=== GEMINI AI DIAGNOSTIC ADVICE ===";
                if (rawOutput.includes(aiMarker)) {
                    const parts = rawOutput.split(aiMarker);
                    const telemetry = parts[0].trim();
                    const markdownAdvice = parts[1].trim();

                    consoleBox.innerText = telemetry;
                    aiContent.innerHTML = formatMarkdownToHTML(markdownAdvice);
                    aiCard.classList.remove('hidden');
                } else {
                    consoleBox.innerText = rawOutput;
                }

                statusElem.innerText = "Execution Complete";
                statusElem.className = "status-ready";
            } catch (err) {
                consoleBox.innerText = "[Network Error] Failed to connect to backend: " + err;
                statusElem.innerText = "Error";
                statusElem.className = "status-error";
            }
        }
    </script>
</body>
</html>
